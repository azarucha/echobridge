// Template for every AirPlay receiver. echobridge fills in the port, UDP ports and the hook script per room
// (__HOOK__) and passes the name with -a. Tested with shairport-sync 5.5 (classic AirPlay, stdout backend).
general = {
  name = "echobridge";
  output_backend = "stdout";              // raw PCM to echobridge, which turns it into a stream
  ignore_volume_control = "no";           // with "yes" shairport-sync doesn't report volume changes
  allow_session_interruption = "yes";
  run_this_when_volume_is_set = "__HOOK__ volume ";
  // echobridge undoes the attenuation exactly (flat curve, 30 dB = iPhone scale 1:1) and sets the
  // Echo's own volume instead
  volume_range_db = 30;
  volume_control_profile = "flat";
  // AirPlay holds audio back ~2 s so several speakers play in sync. We don't need that for a single
  // receiver: output earlier, less delay. Side effect: video on the iPhone is no longer lip-synced.
  audio_backend_latency_offset_in_seconds = -1.6;
};

diagnostics = {
  log_verbosity = 0;
};

sessioncontrol = {
  run_this_before_play_begins = "__HOOK__ session start";
  run_this_after_play_ends = "__HOOK__ session end";
  wait_for_completion = "no";
};
